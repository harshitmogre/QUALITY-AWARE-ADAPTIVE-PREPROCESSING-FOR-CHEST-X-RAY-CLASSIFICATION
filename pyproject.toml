[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-quality-research"
version = "0.1.0"
description = "Quality-aware chest X-ray preprocessing research scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pandas>=2.0", "Pillow>=10.0", "scikit-learn>=1.3", "torch>=2.1", "torchvision>=0.16", "matplotlib>=3.7", "scipy>=1.11", "certifi>=2024.2.2"]

[tool.setuptools.packages.find]
where = ["src"]
